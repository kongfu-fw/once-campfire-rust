name: Deploy Test Campfire

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy container with Docker Compose
        run: |
          DEPLOY_DIR="${HOME}/test_campfire"
          mkdir -p "${DEPLOY_DIR}"
          cp deploy/test-campfire/docker-compose.yml "${DEPLOY_DIR}/"
          cp deploy/test-campfire/.env "${DEPLOY_DIR}/"
          cd "${DEPLOY_DIR}"
          docker compose down
          docker compose pull
          docker compose up -d --remove-orphans
