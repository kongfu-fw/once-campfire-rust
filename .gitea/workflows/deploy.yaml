name: Deploy Test Campfire

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Deploy container with deploy.sh
        run: |
          ./deploy.sh init \
            --dir "${HOME}/test_campfire" \
            --name test_campfire \
            --port 3002 \
            --volume test-campfire_test_campfire_storage \
            --build \
            --yes
